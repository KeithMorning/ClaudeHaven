[package]
name = "claude-vm-tauri"
version = "0.1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
sha2 = "0.10"
rfd = "0.15"
arboard = { version = "3", default-features = false }
reqwest = { version = "0.13.5", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["process", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
